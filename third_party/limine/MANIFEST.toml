files = ["stb_image/LICENSE"]

# libfdt is GPL-2.0-or-later OR BSD-2-Clause; Limine uses BSD-2-Clause.
# COPYRIGHT collects the copyright lines of libfdt's src/ headers, which its
# BSD-2-Clause text leaves as a template.
[[project]]
name = "libfdt"
license = "BSD-2-Clause"
upstream = "https://codeberg.org/OSDev/libfdt.git"
commit = "7bf94e6347129d17eca263112296ad170dec28a9"
