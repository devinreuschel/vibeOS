# The license section at the end of stb_image.h (MIT, the option Limine uses,
# or public domain); the file's SHA-256 is the one ./bootstrap checks.
[[project]]
name = "stb_image"
license = "MIT"
upstream = "https://github.com/nothings/stb/raw/5c205738c191bcb0abc65c4febfa9bd25ff35234/stb_image.h"
commit = "5c205738c191bcb0abc65c4febfa9bd25ff35234"
sha256 = "594c2fe35d49488b4382dbfaec8f98366defca819d916ac95becf3e75f4200b3"
