name = "cc-runtime"
license = "Apache-2.0 WITH LLVM-exception"
upstream = "https://codeberg.org/OSDev/cc-runtime.git"
commit = "dae79833b57a01b9fd3e359ee31def69f5ae899b"
read_from = "https://github.com/osdev0/cc-runtime.git"
files = ["cc-runtime/LICENSE.TXT"]

