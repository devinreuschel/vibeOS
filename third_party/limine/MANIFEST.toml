# Limine's notices (ROADMAP §10.9, DESIGN §1.5). The binary branch setup.sh
# clones ships only LICENSE, so the texts of the projects Limine's 3RDPARTY.md
# lists are kept here, with the release they were copied from.
# scripts/gen_notices.py reads this file and fails when `release` or
# `binary_commit` differs from setup.sh's LIMINE_TAG or LIMINE_COMMIT, or when
# a 3RDPARTY.md entry has no project here.
#
# The v9.6.7 source release archive could not be fetched when these were
# copied, so `source` names the release tag and the commit it points at, and
# each project names the commit Limine's ./bootstrap at that tag pins and the
# repository that commit was read from. LICENSE equals the binary branch's
# LICENSE and the source tree's COPYING byte for byte. Texts only, never code.

release = "v9.6.7"
binary_commit = "ee5d29cd0a8034612dcd1df3f00052480db785c5"
source = "https://github.com/limine-bootloader/limine.git"
source_commit = "6f9722ed66e47498626edc20fff88aaa8b1de85a"

