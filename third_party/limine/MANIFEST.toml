# Limine's notices (ROADMAP §10.9, DESIGN §1.5). The binary archive setup.sh
# unpacks ships only LICENSE, so the texts of the projects Limine's 3RDPARTY.md
# lists are kept here, with the release they were copied from.
# scripts/gen_notices.py reads this file and fails when `release` or `commit`
# differs from setup.sh's LIMINE_TAG or LIMINE_COMMIT, or when a 3RDPARTY.md
# entry has no project here.
#
# LICENSE and 3RDPARTY.md come from the release's source archive, `source`;
# LICENSE equals its COPYING and the binary archive's LICENSE byte for byte.
# Each project names the repository and commit the release's ./bootstrap
# clones, where its text was read, and that text equals the copy the source
# archive ships where it ships one. Texts only, never code.

