# Optional local hooks. Install with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: cargo fmt --check
        language: system
        entry: bash -c 'cargo fmt --check && (cd tests/hostlib && cargo fmt --check)'
        pass_filenames: false
        types: [rust]
      - id: ruff
        name: ruff check tests scripts
        language: system
        entry: ruff check tests scripts
        pass_filenames: false
        types: [python]
      - id: check-scripts
        name: scripts/check_*.py
        language: system
        entry: bash -c 'shopt -s nullglob; for s in scripts/check_*.py; do python3 "$s" || exit 1; done'
        pass_filenames: false
