    # Each provenance header's upstream file at its pinned revision (DESIGN
    # §1.5), which needs the network.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: python3 scripts/check_provenance.py --fetch
        run: python3 scripts/check_provenance.py --fetch

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
