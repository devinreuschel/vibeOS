name: nightly

# ROADMAP §10.1, DESIGN §8.6: the nightly scheduled jobs, each in its own
# scheduled lane (the lane map and ledger in DESIGN §8.6). `kvm` is the x86_64
# KVM leg: `make test-kernel`, the e2e and LAPIC-fallback runs, and the
# §10.10 selection at -smp 4, under `-accel kvm -cpu max,+invtsc`.
# `release-profile` builds and boots `CARGO_PROFILE=release` under TCG.
# `repro`, `models`, `miri`, `irqoff`, `deny-advisories` and
# `provenance-fetch` run the C-SCHED-TARGETS commands; `kvm` also runs
# `make test-irqoff` under KVM. A failed QEMU job uploads its guest cores
# as `cores-x86_64-<job>`. `budget`
# runs `make ci-budget` against the ci-history branch. Jobs call
# only `make` targets and scripts (C-SCHED-TARGETS), and each ends by writing
# its runner record and uploading it with its results files, which the ticks
# job reads for `[nightly]` proofs (C-TICK, C-RESULTS, C-HISTORY). No timeout
# override, skip or retry is set here (AGENTS.md, Do not).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least privilege: the jobs read the tree and write only artifacts and caches,
# which use the runner's own token. ROADMAP §10.1.
permissions:
  contents: read

jobs:
  kvm:
    name: kvm
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    # Scheduled lane 0 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-0
      queue: max
    # The harness fails every boot when QEMU is not this version (ROADMAP
    # §10.1): resolute's qemu-system-x86 1:10.2.1+ds-1ubuntu3. Move the pin
    # and DESIGN §8.6 together. QEMU leaves invariant TSC out of its default
    # migratable vCPU even under KVM, so the leg asks for it (ROADMAP §10.1).
    env:
      VIBEOS_QEMU_VERSION: "10.2.1"
      APT_PACKAGES: qemu-system-x86 xorriso dosfstools
      VIBEOS_QEMU_ACCEL: kvm
      VIBEOS_QEMU_CPU: max,+invtsc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Host packages from a cache keyed by the runner image and the package
      # list (ROADMAP §10.1, DESIGN §8.6): a hit installs the cached .deb files
      # with no `apt-get update` and no download; a miss installs as before
      # and saves what apt downloaded.
      - name: apt cache key
        id: apt-key
        run: |
          sum=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d' ' -f1)
          echo "key=apt-$ImageOS-$ImageVersion-$sum" >> "$GITHUB_OUTPUT"

      - name: cache host packages
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}

      - name: install host tools
        env:
          HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            if ls ~/apt-cache/*.deb >/dev/null 2>&1; then
              sudo dpkg -i ~/apt-cache/*.deb
            fi
          else
            sudo apt-get update
            sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
            mkdir -p ~/apt-cache
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-cache {} +
          fi

      # GitHub's documented udev rule opens /dev/kvm to the runner user.
      - name: open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, x86_64-unknown-linux-musl

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-kvm-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-kvm-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v9.6.7-binary-ee5d29cd0a8034612dcd1df3f00052480db785c5

      - name: setup
        run: ./setup.sh

      # L1194: the in-guest registry under KVM; run_ktest.py's boot check
      # fails the leg when the guest reports no invariant TSC.
      - name: make test-kernel (kvm)
        if: ${{ !cancelled() }}
        run: make test-kernel

      # L1195 (F078): the boot contract at -smp 2 and -smp 1, and the
      # periodic fallback with invariant TSC still asked for.
      - name: make test-e2e (kvm)
        if: ${{ !cancelled() }}
        run: make test-e2e

      - name: make test-e2e (kvm, -smp 1)
        if: ${{ !cancelled() }}
        run: VIBEOS_SMP=1 make test-e2e

      - name: make test-lapic-fallback (kvm)
        if: ${{ !cancelled() }}
        run: make test-lapic-fallback LAPIC_FALLBACK_CPU=qemu64,+invtsc,-tsc-deadline

      # L1196: exit-gate line §10.10's selection, repeated 20 times at -smp 4.
      - name: make test-kernel-smp4 (kvm, §10.10 selection x20)
        if: ${{ !cancelled() }}
        run: VIBEOS_KTEST='lifetime_*,exit_burst,fork_oom' VIBEOS_KTEST_REPEAT=20 make test-kernel-smp4

      # L1321: the IF-off tracer's build variant under KVM, where an IF=0
      # stretch's length is the host's, not TCG's (ROADMAP §10.1, P10-S50).
      - name: make test-irqoff (kvm)
        if: ${{ !cancelled() }}
        run: VIBEOS_QEMU_ACCEL=kvm VIBEOS_QEMU_CPU=max,+invtsc make test-irqoff

      # A failed run's guest cores (ROADMAP §10.7, TESTING.md §8.3): each
      # failed boot's build/cores/<arch>-<tier>/<seq>-<label>/ holds core.zst,
      # kernel.elf and qemu-argv.txt. This workflow names no secret
      # (scripts/check_workflows.py, rule_no_core_upload_with_secrets).
      - name: upload failed-run cores
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cores-x86_64-kvm
          path: build/cores/
          if-no-files-found: ignore
          retention-days: 90

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-kvm
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-kvm
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  release-profile:
    name: release-profile
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # Scheduled lane 1 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-1
      queue: max
    # L1268 (F137): the release profile built and booted under TCG, in its
    # own job, since dev and release ISOs share their names in build/.
    # The harness fails every boot when QEMU is not this version (ROADMAP
    # §10.1): resolute's qemu-system-x86 1:10.2.1+ds-1ubuntu3. Move the pin
    # and DESIGN §8.6 together.
    env:
      VIBEOS_QEMU_VERSION: "10.2.1"
      APT_PACKAGES: qemu-system-x86 xorriso dosfstools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Host packages from a cache keyed by the runner image and the package
      # list (ROADMAP §10.1, DESIGN §8.6): a hit installs the cached .deb files
      # with no `apt-get update` and no download; a miss installs as before
      # and saves what apt downloaded.
      - name: apt cache key
        id: apt-key
        run: |
          sum=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d' ' -f1)
          echo "key=apt-$ImageOS-$ImageVersion-$sum" >> "$GITHUB_OUTPUT"

      - name: cache host packages
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}

      - name: install host tools
        env:
          HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            if ls ~/apt-cache/*.deb >/dev/null 2>&1; then
              sudo dpkg -i ~/apt-cache/*.deb
            fi
          else
            sudo apt-get update
            sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
            mkdir -p ~/apt-cache
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-cache {} +
          fi

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, x86_64-unknown-linux-musl

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-release-profile-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-release-profile-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v9.6.7-binary-ee5d29cd0a8034612dcd1df3f00052480db785c5

      - name: setup
        run: ./setup.sh

      - name: make CARGO_PROFILE=release test-e2e test-kernel
        run: make CARGO_PROFILE=release test-e2e test-kernel

      # A failed run's guest cores (ROADMAP §10.7, TESTING.md §8.3): each
      # failed boot's build/cores/<arch>-<tier>/<seq>-<label>/ holds core.zst,
      # kernel.elf and qemu-argv.txt. This workflow names no secret
      # (scripts/check_workflows.py, rule_no_core_upload_with_secrets).
      - name: upload failed-run cores
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cores-x86_64-release-profile
          path: build/cores/
          if-no-files-found: ignore
          retention-days: 90

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-release-profile
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-release-profile
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  repro:
    name: repro
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    # Scheduled lane 2 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-2
      queue: max
    # A deterministic kernel, initrd and ISO build: every ISO variant built
    # twice and compared byte for byte (scripts/repro_build.py).
    # The harness fails every boot when QEMU is not this version (ROADMAP
    # §10.1): resolute's qemu-system-x86 1:10.2.1+ds-1ubuntu3. Move the pin
    # and DESIGN §8.6 together. setup.sh needs qemu-system-x86_64.
    env:
      VIBEOS_QEMU_VERSION: "10.2.1"
      APT_PACKAGES: qemu-system-x86 xorriso dosfstools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Host packages from a cache keyed by the runner image and the package
      # list (ROADMAP §10.1, DESIGN §8.6): a hit installs the cached .deb files
      # with no `apt-get update` and no download; a miss installs as before
      # and saves what apt downloaded.
      - name: apt cache key
        id: apt-key
        run: |
          sum=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d' ' -f1)
          echo "key=apt-$ImageOS-$ImageVersion-$sum" >> "$GITHUB_OUTPUT"

      - name: cache host packages
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}

      - name: install host tools
        env:
          HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            if ls ~/apt-cache/*.deb >/dev/null 2>&1; then
              sudo dpkg -i ~/apt-cache/*.deb
            fi
          else
            sudo apt-get update
            sudo apt-get install -y -o APT::Keep-Downloaded-Packages=true $APT_PACKAGES
            mkdir -p ~/apt-cache
            find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-cache {} +
          fi

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, x86_64-unknown-linux-musl

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-repro-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-repro-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v9.6.7-binary-ee5d29cd0a8034612dcd1df3f00052480db785c5

      - name: setup
        run: ./setup.sh

      - name: make repro
        run: make repro

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-repro
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-repro
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  models:
    name: models
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # Scheduled lane 2 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-2
      queue: max
    # L1172 and L1453, ROADMAP §10.8: every loom model and every Kani proof
    # (`make models`); setup.sh --kani installs the pinned kani-verifier,
    # which brings its own nightly, and checks no host tool, so this job
    # boots no QEMU.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-models-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-models-

      - name: ./setup.sh --kani && make models
        run: ./setup.sh --kani && make models

      # herd7 from the distro (ROADMAP §11.7): `make litmus` beside `make models`.
      - name: install herd7
        run: |
          sudo apt-get update
          sudo apt-get install -y herdtools7

      - name: make litmus
        run: make litmus

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-models
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-models
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  miri:
    name: miri
    runs-on: ubuntu-26.04
    # A serial `make miri` took over 2 h on a 4-CPU host (P10-S87); 330 is
    # the most a reserved lane allows (DESIGN §8.6).
    timeout-minutes: 330
    # Scheduled lane 2 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-2
      queue: max
    # L1172, ROADMAP §10.8: vibeos-core's host tests under Miri.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: miri, rust-src

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-miri-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-miri-

      - name: make miri
        run: make miri

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-miri
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-miri
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  deny-advisories:
    name: deny-advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Scheduled lane 3 (DESIGN §8.6): one job at a time, the rest queued.
    concurrency:
      group: sched-lane-3
      queue: max
    # `cargo deny check advisories` fetches the RustSec database, so it runs
    # here rather than in make check (ROADMAP §10.9).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22

      # Pinned (ROADMAP §10.9): the release's prebuilt musl archive, checked
      # against its SHA-256, as ci.yml's check job installs it.
      - name: install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo deny check advisories
        run: cargo deny check advisories

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-deny-advisories
          path: build/results/
