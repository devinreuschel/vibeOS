name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Push + PR share one slot per branch; older SHAs get cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase0:
    name: phase 0 ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso nasm ovmf dosfstools

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools, rustfmt, clippy

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v9.6.7-binary-ee5d29cd0a8034612dcd1df3f00052480db785c5

      - name: setup
        run: ./setup.sh

      # Q1: fmt + clippy with -D warnings. rustflags in .cargo/config.toml
      # also deny warnings on `make iso` / `make test-unit`. Do not set
      # RUSTFLAGS here: it replaces the kernel's `-Z unstable-options`.
      - name: cargo fmt --check
        run: |
          cargo fmt --check
          (cd tests/hostlib && cargo fmt --check)

      - name: cargo clippy -D warnings (kernel)
        env:
          CARGO_UNSTABLE_JSON_TARGET_SPEC: "true"
          CARGO_UNSTABLE_BUILD_STD: core,compiler_builtins,alloc
          CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
        run: cargo clippy --lib --bin vibeos --all-features -- -D warnings

      - name: cargo clippy -D warnings (hostlib)
        run: cd tests/hostlib && cargo clippy --all-targets -- -D warnings

      - name: build kernel + hybrid ISO
        run: make iso

      - name: harness unit tests
        run: make test-harness

      - name: host unit tests
        run: make test-unit

      - name: e2e (BIOS)
        run: make test-e2e

      - name: e2e (UEFI / OVMF)
        run: make test-e2e-uefi
        env:
          OVMF: /usr/share/ovmf/OVMF.fd

      - name: e2e (panic path)
        run: make test-e2e-panic

      - name: e2e (#GP dump+halt)
        run: make test-e2e-gp

      - name: e2e (PIT calibration fallback)
        run: make test-e2e-pit

      - name: in-guest kernel tests
        run: make test-kernel

      - name: in-guest kernel tests (-smp 4)
        run: make test-kernel-smp4

      - name: in-guest LAPIC periodic fallback
        run: make test-lapic-fallback

      - name: vibefs QEMU-kill crash consistency
        run: make test-vibefs-crash
