name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Push + PR share one slot per branch; older SHAs get cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  phase0:
    name: phase 0 ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso nasm ovmf

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cache limine binaries
        uses: actions/cache@v4
        with:
          path: limine
          key: limine-v9.6.7-binary

      - name: setup
        run: ./setup.sh

      - name: build kernel + hybrid ISO
        run: make iso

      - name: harness unit tests
        run: make test-harness

      - name: host unit tests
        run: make test-unit

      - name: e2e (BIOS)
        run: make test-e2e

      - name: e2e (UEFI / OVMF)
        run: make test-e2e-uefi
        env:
          OVMF: /usr/share/ovmf/OVMF.fd

      - name: e2e (panic path)
        run: make test-e2e-panic

      - name: e2e (#GP dump+halt)
        run: make test-e2e-gp

      - name: e2e (PIT calibration fallback)
        run: make test-e2e-pit

      - name: in-guest kernel tests
        run: make test-kernel

      - name: in-guest kernel tests (-smp 4)
        run: make test-kernel-smp4

      - name: in-guest LAPIC periodic fallback
        run: make test-lapic-fallback
