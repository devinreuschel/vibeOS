name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the jobs read the tree and write only artifacts and caches,
# which use the runner's own token. ROADMAP §10.1.
permissions:
  contents: read

# Push + PR share one slot per branch; older SHAs get cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # vibeos-core FAT tests spawn fsck.fat. No QEMU / Limine / setup.sh (T3).
      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools, rustfmt, clippy
          # `make check` lints the kernel and vibeos-core's no_std build.
          targets: x86_64-unknown-none

      # Distinct from the ladder's cargo cache so a host-only `target/`
      # cannot evict kernel artifacts (DESIGN §8.6).
      - name: cache cargo (check)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: install python linters
        run: |
          python3 -m pip install --user --break-system-packages ruff mypy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make check
        run: time make check

      - name: install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked --version 0.9.1
          fi

      # Floor 87% (DESIGN §8.6, which records the measured figure). Ratchet only upward.
      - name: vibeos-core llvm-cov floor
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          time cargo llvm-cov -p vibeos-core --lib --features std --target "$HOST" \
            --html --output-dir coverage --fail-under-lines 87

      - name: upload vibeos-core coverage HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  phase0:
    name: phase 0 ladder
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso nasm ovmf dosfstools

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src, llvm-tools, rustfmt, clippy
          targets: x86_64-unknown-none

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v9.6.7-binary-ee5d29cd0a8034612dcd1df3f00052480db785c5

      - name: setup
        run: ./setup.sh

      # One kernel clippy run per feature set an ISO is built with, and one
      # with kernel_shell (ROADMAP §10.1). The default set runs in the `check`
      # job's `make check`. Do not set RUSTFLAGS here: it replaces target
      # rustflags (-D warnings, frame pointers, static relocation, linker flags).
      - name: cargo clippy -D warnings (kernel)
        run: |
          cargo clippy --bin vibeos --features kernel_tests -- -D warnings
          cargo clippy --bin vibeos --features vibefs_crash -- -D warnings
          cargo clippy --bin vibeos --features panic_test --features panic_exit -- -D warnings
          cargo clippy --bin vibeos --features gp_test --features panic_exit -- -D warnings
          cargo clippy --bin vibeos --features kernel_shell -- -D warnings
      - name: build kernel + hybrid ISO
        run: make iso

      - name: e2e (BIOS)
        run: make test-e2e

      - name: e2e (UEFI / OVMF)
        run: make test-e2e-uefi
        env:
          OVMF: /usr/share/ovmf/OVMF.fd

      - name: e2e (panic path)
        run: make test-e2e-panic

      - name: e2e (#GP dump+halt)
        run: make test-e2e-gp

      - name: e2e (PIT calibration fallback)
        run: make test-e2e-pit

      - name: e2e (9 GiB, past the physmap cap)
        run: make test-e2e-highmem

      - name: in-guest kernel tests
        run: make test-kernel

      - name: in-guest kernel tests (-smp 4)
        run: make test-kernel-smp4

      - name: in-guest LAPIC periodic fallback
        run: make test-lapic-fallback

      - name: vibefs QEMU-kill crash consistency
        run: make test-vibefs-crash

      # Per-tier table and every harness retry, even after a failed step
      # (ROADMAP §10.2); check_ticks.py reads the uploaded files (§10.9).
      - name: harness results summary
        if: always()
        run: python3 -m tests.harness.results summary build/results >> "$GITHUB_STEP_SUMMARY"

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-phase0
          path: build/results/
          if-no-files-found: warn
          retention-days: 30

      - name: upload production ISO
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibeos.iso
          path: vibeos.iso
          if-no-files-found: error
          retention-days: 7
