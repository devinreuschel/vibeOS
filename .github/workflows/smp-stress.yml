      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-repeat-kernel-smp4
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  nightly-canary:
    name: latest nightly canary
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # Scheduled lane 5 (DESIGN §8.6); continue-on-error does not free the lane.
    concurrency:
      group: sched-lane-5
      queue: max
    # The harness fails every boot when QEMU is not this version (ROADMAP
    # §10.1): resolute's qemu-system-x86 1:10.2.1+ds-1ubuntu3. Move the pin
    # and DESIGN §8.6 together.
    env:
      VIBEOS_QEMU_VERSION: "10.2.1"
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso ovmf dosfstools

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools, clippy
          targets: x86_64-unknown-none, x86_64-unknown-linux-musl

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-canary-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-canary-

      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v12.9.1-c82c3708b3304be806b2492dc2ce34e219c6f989-${{ runner.arch }}

      - name: setup
        run: ./setup.sh

      - name: iso + host units on latest nightly
        run: make iso && make test-unit
        env:
          RUSTUP_TOOLCHAIN: nightly

      # The host CPU model and the guest's invariant-TSC bit, to the job
      # summary and build/runner.json (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-nightly-canary
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-nightly-canary
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90

  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    # 12 targets of 900 s each, about 3 hours, and the build; 330 is the
    # most a reserved lane allows (DESIGN §8.6).
    timeout-minutes: 300
    # Scheduled lane 5 (DESIGN §8.6, ROADMAP §10.1): one job at a time, the
    # rest queued first in first out.
    concurrency:
      group: sched-lane-5
      queue: max
    # L1232's fuzz campaign (ROADMAP §10.2, P10-S97): every byte-slice
    # parser's cargo-fuzz target on the pinned toolchain; `make fuzz`
    # refuses any cargo-fuzz but the version it pins.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-09-22
          components: rust-src

      - name: cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock', 'tests/fuzz/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: install cargo-fuzz
        run: |
          if [ "$(cargo fuzz --version 2>/dev/null)" != "cargo-fuzz 0.13.2" ]; then
            cargo install cargo-fuzz --locked --version 0.13.2
          fi

      - name: make fuzz FUZZ_TIME=900
        run: make fuzz FUZZ_TIME=900

      # A crashing input, for the fix's regression corpus (TESTING.md §8.1).
      - name: upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 90

      # The host CPU model, to the job summary and build/runner.json
      # (ROADMAP §10.1, C-HISTORY).
      - name: runner record
        if: always()
        run: python3 scripts/runner_info.py

      - name: upload harness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-x86_64-fuzz
          path: build/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: upload runner record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-fuzz
          path: build/runner.json
          if-no-files-found: ignore
          retention-days: 90
