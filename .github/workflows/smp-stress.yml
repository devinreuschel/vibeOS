      - name: cache limine binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: limine
          key: limine-v12.9.1-c82c3708b3304be806b2492dc2ce34e219c6f989-${{ runner.arch }}

      - name: setup
        run: ./setup.sh

      - name: make test-kernel-smp4 (each run 20 times)
