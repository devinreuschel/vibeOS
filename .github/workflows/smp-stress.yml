name: smp-stress

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  stress:
    name: high-CPU SMP stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso nasm ovmf

      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cache limine binaries
        uses: actions/cache@v4
        with:
          path: limine
          key: limine-v9.6.7-binary

      - name: setup
        run: ./setup.sh

      - name: SMP stress (-smp 4, longer timeout)
        run: make test-smp-stress
