[package]
name = "vibeos-core"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

# Portable half. Sources live in `crates/core/src/<subsystem>/` (DESIGN §1.3).
# Host tests: `cargo test -p vibeos-core --features std`.
[lib]
name = "vibeos"

[features]
default = []
# Host tools and `cargo test`. Kernel builds leave this off (`no_std`).
std = []
