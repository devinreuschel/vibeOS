[package]
name = "vibeos-core"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Portable half. Sources live in `crates/core/src/<subsystem>/` (DESIGN §1.3).
# Host tests: `cargo test -p vibeos-core --features std`.
[lib]
name = "vibeos"

[features]
default = []
# Host tools and `cargo test`. Kernel builds leave this off (`no_std`).
std = []

[dependencies]
# Compile-time proof that a typed copy to user memory has no padding or
# uninitialized bytes (INVARIANTS §2.4, ROADMAP §10.6).
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[lints]
workspace = true

# Loom models (ROADMAP §10.8) are `#[cfg(all(test, loom))]` unit tests, built
# with `RUSTFLAGS="--cfg loom"`; `crate::atomic` swaps in loom's atomics there.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
