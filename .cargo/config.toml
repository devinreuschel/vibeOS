[build]
target = "x86_64-unknown-none-executable.json"
rustflags = ["-Z", "unstable-options", "-D", "warnings"]

# build-std is invoked from the Makefile (`-Z build-std=...`), not from
# this file. Cargo merges config from parent directories, so putting
# build-std here makes `tests/hostlib` compile a second `core` that
# clashes with std (DESIGN §8.1 / this file's original note).
