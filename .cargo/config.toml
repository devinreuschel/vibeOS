[build]
target = "x86_64-unknown-none"
rustflags = ["-D", "warnings"]

# Kernel-only flags. Keep them off [build] rustflags so tests/hostlib does
# not inherit linker/code-gen overrides. Hostlib still pins a GNU triple
# in its own config (A2 step 3 removes that pin).
[target.x86_64-unknown-none]
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "relocation-model=static",
    # Builtin spec defaults to PIE + full RELRO; we want a static ET_EXEC.
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=-znorelro",
]
