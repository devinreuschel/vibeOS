[workspace]
members = ["crates/core", "tests/hostlib", "user", "user/mem"]
exclude = ["tests/fuzz"]
resolver = "3"

# C-LINTS (ROADMAP §10.1): every member has `[lints] workspace = true`. A module
# not yet swept carries `#[allow(<lint>, reason = "audit pending, ROADMAP §10.1")]`
# on its `mod` line until its sweep removes it.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"

# Cargo takes no lints table beside `[lints] workspace = true` in a member,
# so loom's cfg (ROADMAP §10.8) is declared here.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[package]
name = "vibeos"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false
autolib = false

[[bin]]
name = "vibeos"
path = "src/main.rs"

[features]
default = []
# Force a panic early in boot so the panic path can be exercised end to end.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
panic_test = []
# Second kernel build: run the in-guest test registry after init (DESIGN §8.2).
# Packaged from its own named ELF into its own ISO; never the production image.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
# release.yml still uploads vibeos-ktest.iso until ROADMAP §10.1's release box (F145).
kernel_tests = []
# Debug: keep the kernel interactive REPL instead of `/sbin/init`.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
kernel_shell = []
# After a full boot, trigger a #GP so the dump+halt path is e2e-tested.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
gp_test = []
# Panic dump ends with QEMU isa-debug-exit (nonzero) instead of an infinite hlt.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
panic_exit = []
# After a full boot, underflow `irq_nest` so the dump must write without an
# `InterruptGuard` (ROADMAP §10.7, F071).
# Test-only (AGENTS.md rule 9): no published ISO enables it.
panic_nest_test = []
# After a full boot at -smp 5, panic on two CPUs while three others print,
# wait on a lock, and spin, so the dump's stop primitive stops each
# (ROADMAP §10.7, F135).
# Test-only (AGENTS.md rule 9): no published ISO enables it.
panic_stop_test = []
# Write-loop kernel for QEMU-kill crash consistency (docs/VIBEFS.md §12).
# Its own named ELF and ISO; never the production image.
# Test-only (AGENTS.md rule 9): no published ISO enables it.
vibefs_crash = ["vibeos/crash_plant"]

[lints]
workspace = true

[dependencies]
limine = "0.6"
vibeos = { path = "crates/core", package = "vibeos-core" }

[profile.dev]
# opt-level 0 makes page-table setup overflow the boot stack; DESIGN §3.5.
opt-level = 1
# Unwind so host `#[should_panic]` / `catch_unwind` work. The
# `x86_64-unknown-none` target still aborts (A2).
panic = "unwind"
overflow-checks = true
debug = true

[profile.release]
opt-level = 3
# Overflow panics in shipped images as in dev (DESIGN §3.5, AGENTS.md rule 4).
overflow-checks = true
panic = "abort"
lto = false
debug = true
