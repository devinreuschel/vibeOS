[package]
name = "vibeos"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "vibeos"
path = "src/lib.rs"

[[bin]]
name = "vibeos"
path = "src/main.rs"

[features]
default = []
# Force a panic early in boot so the panic path can be exercised end to end.
panic-test = []
# Second kernel build: run the in-guest test registry after init (DESIGN §8.2).
# Packaged into its own Cargo target dir / ISO; never the production image.
kernel_tests = []
# After a full boot, trigger a #GP so the dump+halt path is e2e-tested.
gp-test = []
# Panic dump ends with QEMU isa-debug-exit (nonzero) instead of an infinite hlt.
panic_exit = []

[dependencies]
limine = "0.6"

[profile.dev]
# opt-level 0 makes page-table setup overflow the boot stack; DESIGN §3.5.
opt-level = 1
panic = "abort"
overflow-checks = true
debug = true

[profile.release]
opt-level = 3
panic = "abort"
lto = false
debug = true
