[package]
name = "vibeos-hostlib-tests"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

# Host-side wrapper around the portable half of the kernel.
# Includes the source files directly (see src/lib.rs) rather than depending
# on the kernel crate, so no bare-metal / build-std / limine config leaks in.

[lib]
path = "src/lib.rs"

[[bin]]
name = "mkfs-vibefs"
path = "src/bin/mkfs_vibefs.rs"

[[bin]]
name = "fsck-vibefs"
path = "src/bin/fsck_vibefs.rs"

[dependencies]
