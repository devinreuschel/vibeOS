[package]
name = "vibeos-hostlib-tests"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

# Host mkfs/fsck, the crash test's nbd-cache and vibefs-cat. Portable tests live in `vibeos-core` (`make test-unit`).
# Host tests of a port's assembly live here too, since `vibeos-core` carries none.
# Parent `.cargo/config.toml` defaults to the kernel triple, so Makefile
# host recipes pass `--target $(HOST_TRIPLE)`.
autolib = false

[[bin]]
name = "mkfs-vibefs"
path = "src/bin/mkfs_vibefs.rs"

[[bin]]
name = "fsck-vibefs"
path = "src/bin/fsck_vibefs.rs"

[[bin]]
name = "nbd-cache"
path = "src/bin/nbd_cache.rs"

[[bin]]
name = "vibefs-cat"
path = "src/bin/vibefs_cat.rs"

[[bin]]
name = "mkinitrd"
path = "src/bin/mkinitrd.rs"

[[test]]
name = "switch_context"
path = "tests/switch_context.rs"

[dependencies]
vibeos = { path = "../../crates/core", package = "vibeos-core", features = ["std"] }

[lints]
workspace = true
