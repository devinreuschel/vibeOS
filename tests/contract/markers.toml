# The marker registry (ROADMAP §10.2, TESTING.md §8.3): every line the kernel
# prints with `marker!` and every line the harness matches, one `[[marker]]`
# row each. `tests/harness/registry.py` loads it; `tests/harness/harness.py`
# builds each configuration's contract list and every failure list from it;
# `scripts/check_markers.py` (in `make check`) keeps it, `src/` and
# `crates/core/src/marker.rs` in agreement.
#
# A row's keys:
#   text     required. Placeholders are `<[a-z_]+>` and stand for the parts
#            that vary; the text never starts with one.
#   kind     `contract` (asserted in order), `diagnostic` (printed, not
#            asserted), `failure` (the harness fails the run on it: a panic
#            signature, a failure line, or a halt reason), or `test` (the
#            ktest and utest protocol).
#   arch     `both`, `x86_64` (a line that names x86 hardware), or `aarch64`.
#   source   `kernel` (matched on framed lines, DESIGN §2.6), `user`
#            (unframed), or `limine` (unframed, before the first framed line).
#   section  `§N.M`, the ROADMAP `### N.M` section whose work prints the line.
#   order    contract rows only: a unique int, in steps of 10; the contract
#            is in this order.
#   name     contract rows only: the name the harness reports the marker by.
#   when     contract rows only, optional: terms that must all hold, from
#            `hpet`, `pit`, `smp>1`, `gp_test`, `panic_test`,
#            `panic_nest_test` and `panic_stop_test`, each
#            optionally prefixed with `!`. Absent means every configuration.
#   repeat   contract rows only, optional: `"per_ap"`. Consecutive per-AP
#            rows form a group that repeats for each AP `i` in `1..N`, with
#            `<n>` bound to `i` and `<ap>` to `i - 1` in text and name. The
#            contract row after the group comes after exactly `N - 1` lines
#            of the group's last row and before any other (F141).
#   `<mode>` is bound by the harness to the LAPIC timer mode it expects.
#
# A failure row whose placeholders all follow its last literal fails a line
# that holds the text before its first placeholder (its head signature);
# any other failure row fails a line its pattern matches.
#
# C-MARKERS: a slice that prints a new line the harness should know adds its
# row in the commit that first prints it, in the block of its ROADMAP
# section below (blocks in ROADMAP section order), with a `Gate-change:`
# trailer.

