# Box dependencies for Phase 10 (docs/ROADMAP.md, Phase 10 Order).
# Each [[box]] names a box by `key`, a substring of exactly one line of
# docs/ROADMAP.md, and lists in `needs` the keys of the boxes it cannot be
# ticked before. `why` says where the edge comes from: the box's own text
# ("lands after", "lands with", "lands before") or the claim it makes.
# scripts/check_review_refs.py reads this file (ROADMAP §10.9).

[wave1]
# Wave-1 boxes that cite no CRITICAL or HIGH finding; `--closed` finds the rest.
# The kernel -D warnings and clippy boxes open wave 1: the standing gate binds every fix.
roots = [
  "until those retries are gone, every retry the harness takes",
  "`scripts/check_review_refs.py` reads `tests/gates/phase-10-needs.toml`",
  "`scripts/check_ticks.py`, which a `ticks` CI job runs on every pull request",
  "`-D warnings` reaches every kernel build",
  "CI runs `cargo clippy --bin vibeos -- -D warnings`",
]

