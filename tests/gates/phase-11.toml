# Phase 11's gate map (ROADMAP §10.9, C-GATEMAP). One [[line]] per exit-gate
# line but the tag. HVF records live in common.toml, not here.

[[line]]
key = """
`make ARCH=aarch64` produces a bootable image; `make ARCH=aarch64 run` boots under DESIGN §8.4's
aarch64 command line (`qemu-system-aarch64 -machine virt,acpi=off,gic-version=3`; §11.5, §11.7), with
`-accel hvf` on the macOS dev host (GitHub's arm64 runners have no `/dev/kvm`, so the project has no
arm64 KVM host)"""
[[line.entry]]
cmd = "python3 scripts/check_workflows.py"
[[line.entry]]
job = { workflow = "ci.yml", job = "build" }
[[line.entry]]
job = { workflow = "ci.yml", job = "tier" }

[[line]]
key = """
every marker in the shared and aarch64 lists of the [DESIGN §8.3](TESTING.md#83-end-to-end) contract, from `serial online`
through `shell ready`, appears in order on aarch64, from one harness with an `ARCH` parameter"""
[[line.entry]]
job = { workflow = "ci.yml", job = "tier" }

[[line]]
key = """
`make test-kernel ARCH=aarch64` passes every in-guest test that is not x86-specific, including the
Phase 6 MSI-X tests and the §10.6 user-memory tests, on the default `gic-version=3`, where MSI-X
goes through the ITS, and again with `gic-version=2`, where it goes through GICv2m, and the harness
reads the verdict from QEMU's exit status and its QMP `GUEST_PANICKED` event under TCG and HVF
(§11.7); each x86-specific test is `ktest_skip`ped with a reason naming the x86 feature it needs,
and the harness fails if the skipped set differs from the aarch64 rows of `tests/harness/skips.toml`
(§10.2), which `docs/ARCH.md` links; each skip row also names the aarch64 test that proves the same
property, or says that the property has no aarch64 counterpart and why, and
`scripts/check_arch.py` fails a row that does neither"""
[[line.entry]]
cmd = "python3 scripts/check_arch.py"
[[line.entry]]
job = { workflow = "ci.yml", job = "tier" }

[[line]]
key = """
`/bin/tests` from the Phase 10 user crate passes on aarch64 at EL0, against the arm64 syscall
numbers"""
[[line.entry]]
job = { workflow = "ci.yml", job = "tier" }

[[line]]
key = """
the harness types `echo serial-ok` into the shell on aarch64 through the PL011 and a second command
through the QEMU monitor's `sendkey` and virtio-keyboard, and reads both echoes on serial, as the
x86 e2e boot does through COM1 and PS/2"""
[[line.entry]]
job = { workflow = "ci.yml", job = "tier" }

[[line]]
key = """
`-smp 4` under `virt` brings up every core through PSCI, and the TLB shootdown test passes"""
