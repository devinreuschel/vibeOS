[[line]]
key = """
syscall copies to and from the calling process go only through the §10.6 accessors, and only the
named fill API writes to an address space that is not running, which
`scripts/check_user_access.py` in `make check` keeps true (§10.6). In-guest tests show three
things. SMAP faults a stray kernel data access to a user page, including one from an exception
handler entered with the accessor window open. SMEP faults a kernel jump into a user page. A
kernel-half pointer, and `read()` into a read-only user page, both return `EFAULT`"""
[[line.entry]]
cmd = "python3 scripts/check_user_access.py"
[[line.entry]]
cmd = "make test-kernel"
[[line.entry]]
cmd = "make test-e2e"

[[line]]
key = """
no user context reaches `iretq` or `sysretq` with a non-canonical RIP, and the kernel survives
an ELF whose last page holds a `syscall` (§10.6)"""
[[line.entry]]
cmd = "VIBEOS_KTEST=exec_top_page_enoexec,noncanonical_rip_sigsegv make test-kernel"
[[line.entry]]
job = { workflow = "nightly.yml", job = "kvm" }

[[line]]
key = """
ring 3 cannot halt the kernel through an exception: the in-guest tests `user_single_step`
(`RFLAGS.TF` set with `popf`), `user_int1`, and `user_exceptions` (`int3`, `#DE`, `#UD`, `#GP`,
`#PF`, x87 `#MF` raised in ring 3, and SIMD `#XM` in the KVM leg only) each find the program
killed by its signal and the kernel running, in `make test-kernel` and `make test-kernel-smp4`
under TCG and in the §10.1 KVM leg's `make test-kernel` (§10.5, §10.6)"""
[[line.entry]]
cmd = "VIBEOS_KTEST=user_single_step,user_int1,user_exceptions make test-kernel"
[[line.entry]]
cmd = "VIBEOS_KTEST=user_single_step,user_int1,user_exceptions make test-kernel-smp4"
[[line.entry]]
job = { workflow = "nightly.yml", job = "kvm" }

[[line]]
key = """
ring 3 cannot halt the kernel through an interrupt or a return to user mode: the in-guest tests
`user_device_irq` (a pool vector and the keyboard vector that CPU 1 sends while CPU 0 runs ring
3 with IF=1), `user_ipi` (a reschedule IPI taken at CPL 3), `console_read_exit` (the return from
a `read()` that halted in `wait_key`), and `user_entry_irq` (1,000 forked children entering ring
3 under reschedule IPIs from another CPU) pass in `make test-kernel` and `make test-kernel-smp4`
under TCG and in the §10.1 KVM leg's `make test-kernel` (§10.6)"""
[[line.entry]]
cmd = "VIBEOS_KTEST=user_device_irq,user_ipi,console_read_exit,user_entry_irq make test-kernel"
[[line.entry]]
cmd = "VIBEOS_KTEST=user_device_irq,user_ipi,console_read_exit,user_entry_irq make test-kernel-smp4"
[[line.entry]]
job = { workflow = "nightly.yml", job = "kvm" }

[[line]]
key = """
ring 3 cannot halt the kernel by exhausting a resource: the in-guest tests `exit_burst` (16
processes exit back to back, each handing off to a sibling resumed from timer preemption),
`fork_oom` (a `fork` whose kernel-stack allocation fails returns `ENOMEM` and leaves the
free-frame count at its baseline), and `exec_huge_memsz` (an exec with a 64 GiB `p_memsz`, and
one under the §10.4 `limits` exec cap (§10.6) but larger than the guest's RAM (192 MiB of
`p_memsz`), each return `ENOMEM` and leave the free-frame count at its baseline) pass in `make
test-kernel` and `make test-kernel-smp4` under TCG and in the §10.1 KVM leg's `make test-kernel`
(§10.6, §10.10)"""
[[line.entry]]
cmd = "VIBEOS_KTEST=exit_burst,fork_oom,exec_huge_memsz make test-kernel"
[[line.entry]]
cmd = "VIBEOS_KTEST=exit_burst,fork_oom,exec_huge_memsz make test-kernel-smp4"
[[line.entry]]
job = { workflow = "nightly.yml", job = "kvm" }

[[line]]
key = """
the §10.10 completion, stack-reclaim, and TLB-shootdown-ack tests, selected with `VIBEOS_KTEST`
and run with `VIBEOS_KTEST_REPEAT=20`, pass in `make test-kernel-smp4` under TCG and under KVM
on the §10.1 KVM leg, which runs that target for this line, and those whose box does not name
`make test-kernel-smp4` also pass in `make test-kernel` (§10.10)"""
[[line.entry]]
cmd = "VIBEOS_KTEST='lifetime_*,exit_burst,fork_oom' VIBEOS_KTEST_REPEAT=20 make test-kernel-smp4"
[[line.entry]]
cmd = "VIBEOS_KTEST='lifetime_iowaiter_publish_last,exit_burst,fork_oom' VIBEOS_KTEST_REPEAT=20 make test-kernel"
[[line.entry]]
job = { workflow = "nightly.yml", job = "kvm" }

[[line]]
key = """
a boot of the production ISO leaves `vda` byte-identical when it holds a 1 MiB whole-disk vibefs
image, and when it holds a 1 MiB image whose only non-zero bytes are `0x55AA` at offset 510 (the
empty partition table `part` also finds on a whole-disk FAT32 volume): an e2e case in `make
test-e2e` boots once with each image and compares its SHA-256 before and after (§10.11)"""
[[line.entry]]
cmd = "make test-e2e"

[[line]]
key = """
a file offset cannot halt the kernel: the §10.11 in-guest tests on `/vibe` get `EFBIG` from a
`write` after `lseek` to `2^44 - 4096`, `EINVAL` from `lseek` to `2^44`, and 5 GiB + 1 from
`lseek(fd, 0, SEEK_END)` after a one-byte `write` at offset 5 GiB, in `make test-kernel`
(§10.11)"""
[[line.entry]]
cmd = "VIBEOS_KTEST=vibefs_efbig,vibefs_seek_end_5gib make test-kernel"

[[line]]
key = """
`make test-vibefs-crash` passes over the §10.2 volatile-cache device, and fails against a
`vibefs_crash` build with a planted leak of one block per commit and against one that writes the
superblock before the Flush ahead of it completes, each of which this line's §10.9 gate-map
entry runs by booting the `vibefs_crash` build with its §10.2 `vibeos.crash_plant=` option
(§10.2, §10.11)"""
[[line.entry]]
cmd = "make test-vibefs-crash"
[[line.entry]]
cmd = "VIBEOS_CMDLINE=vibeos.crash_plant=leak make test-vibefs-crash"
expect = "fail"
[[line.entry]]
cmd = "VIBEOS_CMDLINE=vibeos.crash_plant=early_super make test-vibefs-crash"
expect = "fail"

