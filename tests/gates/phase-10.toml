# Phase 10's gate map (ROADMAP §10.9, the gate-map box; C-GATEMAP).
#
# One [[line]] per exit-gate line of Phase 10 but the tag. `key` is the line's
# text after `- [ ] ` or `- [x] `, wrapped at word boundaries into a multi-line
# basic string (no gate line holds a double quote or a backslash); it is
# compared with the line with whitespace collapsed. Each [[line.entry]] holds
# exactly one of
#   cmd = "..."                             a local command, run with `sh -c` at the root
#   job = { workflow = "...", job = "..." } a job of a GitHub-hosted workflow, green on a
#                                           run that proves the gated commit
#   record = { cmd = "..." }                a dev-host record: the command's run on the
#                                           Apple Silicon dev host, read from ci-history
# and an optional `expect = "fail"`: a command that must fail, counted only
# after a plain entry of its line passed in the same run. A line passes when
# every entry does. Commands holding quotes are ''' literal strings. No entry
# runs the gate runner itself. scripts/check_gates.py (make check) checks this
# file against docs/ROADMAP.md; docs/TESTING.md §8.5 and §8.6 describe the rest.
#
# `test -f .github/workflows/<wf>.yml` entries stand in for the job entries of
# workflows not yet in the tree, which check_workflows.py's rule_gate_dispatch
# rejects while the file is missing; the slice that adds the workflow replaces
# them with the job entries, so until then those lines fail rather than pass
# without them. nightly.yml's entries name its `kvm` job and the `models` and
# `miri` jobs, which fail their line until the slice that adds them lands.

[[line]]
key = """
`make check` (fmt, clippy with warnings denied, host units, harness units) gates CI ahead of the
QEMU ladder"""
[[line.entry]]
cmd = "make check"
[[line.entry]]
cmd = "python3 scripts/check_workflows.py"

[[line]]
key = """
`make check` passes on macOS and Linux, and a scheduled macOS CI job proves it"""
[[line.entry]]
cmd = "make check"
[[line.entry]]
job = { workflow = "macos.yml", job = "check" }

[[line]]
key = """
`make test` passes on the scheduled macOS CI job, with Homebrew's QEMU and its code-only
`edk2-x86_64-code.fd` as the UEFI firmware (F079)"""
[[line.entry]]
job = { workflow = "macos.yml", job = "test" }

