<reason>`, or `superseded: <what replaced it>`; on `implemented`, `declined`, or `superseded`
while an open box in Phases 0 to 10 cites the code, and on `proposed` or `in progress` while
none does, where a box cites a code that opens an item of a parenthesized list on its line, as
in `(Q1, F147)`; and its `--closed` mode, which this line's §10.9 gate-map entry runs, fails on
any `proposed` or `in progress` row. It also fails when the plan of a `proposed` or `in
progress` code has no `**ROADMAP:**` line above its first table, naming its boxes and, after
`Superseded here:`, the steps they supersede. A box that cites a code is not deferred past Phase
10: its code is implemented here, or the box moves to the phase that lands it and the code reads
`superseded:` naming that box, or `declined:`"""
