# vibeOS Limine config. Single entry, serial console enabled.
# Options the boot contract relies on are stated, not inherited, because
# Limine's defaults changed across major versions. ROADMAP §18.2 sets
# kaslr and randomise_hhdm_base to yes.
timeout: 0
serial: yes

/vibeOS
    protocol: limine
    path: boot():/boot/vibeos
    module_path: boot():/boot/initrd.fat
    kaslr: no
    randomise_hhdm_base: no
    # Kernel command line (BOOT.md §3.2); QEMU's fw_cfg opt/vibeos/cmdline is appended after it.
    cmdline: vibeos.strace=0
